server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/tour_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root127dream}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:5MB}
      max-request-size: ${FILE_MAX_SIZE:5MB}

trip:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    access-prefix: /files
    max-size: ${FILE_MAX_SIZE:5MB}
  compression:
    backfill-enabled: ${DIARY_COMPRESSION_BACKFILL_ENABLED:false}
    batch-size: ${DIARY_COMPRESSION_BATCH_SIZE:100}
    verify-existing: ${DIARY_COMPRESSION_VERIFY_EXISTING:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

logging:
  level:
    root: info
    com.trip: debug
