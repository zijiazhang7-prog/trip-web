server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/tour_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root127dream}
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:5MB}
      max-request-size: ${FILE_MAX_SIZE:5MB}

trip:
  file:
    upload-dir: ${FILE_UPLOAD_DIR:uploads}
    access-prefix: /files
    max-size: ${FILE_MAX_SIZE:5MB}
  compression:
    backfill-enabled: ${DIARY_COMPRESSION_BACKFILL_ENABLED:false}
    batch-size: ${DIARY_COMPRESSION_BATCH_SIZE:100}
    verify-existing: ${DIARY_COMPRESSION_VERIFY_EXISTING:false}
  ai:
    animation:
      provider: ${AI_ANIMATION_PROVIDER:mock-template}
      fallback-enabled: ${AI_ANIMATION_FALLBACK_ENABLED:true}
      base-url: ${AI_API_BASE_URL:}
      api-key: ${AI_API_KEY:}
      model: ${AI_MODEL_NAME:}
      connect-timeout: ${AI_CONNECT_TIMEOUT:3s}
      read-timeout: ${AI_READ_TIMEOUT:45s}
      max-images: ${AI_MAX_IMAGES:6}
      max-image-size: ${AI_MAX_IMAGE_SIZE:2MB}
      max-total-image-size: ${AI_MAX_TOTAL_IMAGE_SIZE:8MB}
      max-content-chars: ${AI_MAX_CONTENT_CHARS:3000}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2500}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

jwt:
  secret: ${JWT_SECRET:dev-only-change-me-to-a-long-random-secret}
  expire-minutes: ${JWT_EXPIRE_MINUTES:120}

logging:
  level:
    root: info
    com.trip: debug
